# coturn configured as a STUN-only server for the demo (UDP 3478).
# STUN reveals to this server the public address of whoever asks; see the
# README's CROPS "P" line. No relay allocations, no TURN credentials, no secrets.
stun-only
listening-port=3478
# Set to the machine's public IP (the value is a public address, not a secret).
# listening-ip=
# external-ip=
no-tls
no-dtls
no-cli
no-software-attribute
fingerprint
log-file=stdout
simple-log

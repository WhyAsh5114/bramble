server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self'" always;
  location = /install.sh { default_type text/plain; add_header Cache-Control "no-cache"; }
  location = /uninstall.sh { default_type text/plain; add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ =404; }
}

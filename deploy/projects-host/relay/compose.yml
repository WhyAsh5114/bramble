# The free bramble relay on the projects host. Runs as a Dokploy "Compose"
# app (or plain `docker compose`), not a Swarm service: Swarm ignores
# `runtime`, and the relay must run under gVisor like every project here.
#
#   RELAY_PUBLIC_HOST  name or IP devices reach data sessions at
#   RELAY_MAX_BYTES_PER_DAY / _PER_MONTH  the forwarding budget; past it the
#                      relay keeps introducing peers but stops carrying traffic
name: bramble-relay
services:
  relay:
    build:
      context: ../../../relay
      args:
        VERSION: ${RELAY_VERSION:-dev}
    image: bramble-relay:${RELAY_VERSION:-dev}
    runtime: runsc
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    environment:
      RELAY_PUBLIC_HOST: ${RELAY_PUBLIC_HOST:?set RELAY_PUBLIC_HOST}
      RELAY_MAX_BYTES_PER_DAY: ${RELAY_MAX_BYTES_PER_DAY:-3221225472}
      RELAY_MAX_BYTES_PER_MONTH: ${RELAY_MAX_BYTES_PER_MONTH:-85899345920}
      RELAY_TRACE: ${RELAY_TRACE:-0}
    ports:
      - '9420:9420/tcp'
      - '3478:3478/udp'
      - '40000-40999:40000-40999/udp'
    volumes:
      - state:/state
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  state:
